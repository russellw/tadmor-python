<details{% if action_error.email or email_result %} open{% endif %}>
  <summary>Email</summary>
  <form method="post" action="{{ email_url }}" class="actions mt-s">
    {% csrf_token %}
    <input class="wide-input" name="to" placeholder="Recipients, comma separated (blank: the counterparty's email on file)">
    <button>Send</button>
  </form>
  {% if action_error.email %}<p class="error" role="alert">{{ action_error.email }}</p>{% endif %}
  {% if email_result %}<p class="notice" role="status">Sent to {{ email_result|join:", " }}.</p>{% endif %}
</details>
